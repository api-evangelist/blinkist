name: Blinkist
description: >-
  Blinkist is a Berlin-founded subscription learning app that condenses the key
  ideas of thousands of nonfiction books and podcasts into roughly 15-minute
  text and audio summaries called "Blinks." Launched in 2012, it is used by
  millions of readers to learn on the go across categories such as productivity,
  business, psychology, personal growth, and science, and it also offers
  Blinkist for Business for teams and organizations. The consumer product is
  delivered through the web and iOS/Android apps backed by a private mobile
  backend at api.blinkist.com; Blinkist does not publish a public developer API,
  SDKs, or a developer portal. Blinkist was added to the API Evangelist network
  as a portfolio-company lead (backed by Insight Partners) and enriched with the
  provider signals that could be verified from its public surface.
